      Two faces, two jobs. Archivo is the voice: an industrial grotesque with
      enough character to be recognisable and enough restraint to sit under
      dense tables. IBM Plex Mono carries every figure — lap times, positions,
      probabilities — because this product is a timing readout and its numbers
      should look like instrument output rather than prose.

      Preconnected because both are render-blocking for the masthead.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <title>F1 Forecast — published before the race, scored after</title>
