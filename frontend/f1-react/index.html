<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The palette is light; this said dark, which asked the browser to paint
         form controls and scrollbars for a theme the page does not have. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Formula 1 race forecasts, published before each race and scored against the result afterwards." />

    <!--
      Three faces, three jobs.

      Archivo is the voice: an industrial grotesque with enough character to be
      recognisable and enough restraint to sit under dense tables. It is loaded
      with its width axis so headlines can be set expanded — the display weight
      comes from the same family rather than a second grotesque, which keeps the
      masthead and the headline unmistakably related.

      Source Serif 4 carries prose. One Blog is reading, not interface: race
      reports, stewards' wording, what the model would and would not claim. A
      screen-tuned editorial serif makes that read as reporting, and sets it
      apart from the surrounding instrumentation at a glance rather than by
      position on the page.

      IBM Plex Mono carries every figure — lap times, positions, probabilities —
      because this product is a timing readout and its numbers should look like
      instrument output rather than prose.

      Preconnected because all three are render-blocking for the masthead.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <!-- Link previews (Slack, iMessage, WhatsApp, X). Static on purpose: the
         app renders in the browser, so a crawler only ever sees this file. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="F1 Forecast" />
    <meta property="og:title" content="F1 Forecast — published before the race, scored after" />
    <meta property="og:description" content="Calibrated Formula 1 race probabilities, locked before each race and scored against the result, with the full track record." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="F1 Forecast — published before the race, scored after" />
    <meta name="twitter:description" content="Calibrated Formula 1 race probabilities, locked before each race and scored against the result." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>F1 Forecast — published before the race, scored after</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
