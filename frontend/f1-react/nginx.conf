server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite fingerprints JS/CSS filenames with a content hash, so we can
    # cache them aggressively in production.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # All /f1/* requests are forwarded to the Java backend container.
    # Because nginx runs inside the same Docker network as the backend,
    # "backend" resolves to the f1_backend container automatically.
    location /f1/ {
        proxy_pass         http://backend:8082/f1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow streaming responses (AI Season Review / Race Rewind)
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router handles client-side routing. Any path that doesn't match
    # a static file is served index.html so the client router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
