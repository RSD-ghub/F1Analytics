server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite fingerprints JS/CSS filenames with a content hash, so we can
    # cache them aggressively in production.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── No API proxy here ────────────────────────────────────────────────────
    # This container serves static files and nothing else.
    #
    # It used to carry a /api/ block proxying to core-api, left from an earlier
    # arrangement where nginx was the front door. It is not: Caddy terminates
    # TLS and routes /api/* straight to core-api, so nothing reaches this
    # server under /api and the block was dead.
    #
    # Dead and load-bearing, though. nginx resolves a proxy_pass hostname when
    # it loads its config, not per request, so an unresolvable "core-api" would
    # stop this container from starting at all — turning a backend that is slow
    # to become healthy into a site that serves nothing, when it could still be
    # serving the whole front end.

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router handles client-side routing. Any path that doesn't match
    # a static file is served index.html so the client router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
