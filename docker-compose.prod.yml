# ─────────────────────────────────────────────────────────────────────────────
# F1 Forecasting Platform — production
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Standalone rather than an override of docker-compose.yml, deliberately.
# Compose *appends* `ports` from override files instead of replacing them, so an
# override cannot un-publish the database — it would silently inherit
# 27017 and leave an open MongoDB on a public IP. A separate file cannot make
# that mistake.
#
# Reachable from the internet: Caddy, on 80 and 443, and nothing else. Every
# other service is on the internal network only, which is what keeps core-api
# the single place authentication happens.
#
# Required in .env:
#   DOMAIN            the hostname Caddy gets a certificate for
#   ACME_EMAIL        for Let's Encrypt expiry notices
#   JWT_SECRET        32+ random bytes; no default, the app refuses to start
#   MONGO_USER        database credentials — the database is authenticated here
#   MONGO_PASSWORD      even though it is not reachable from outside
#   TINKER_API_KEY    optional; without it Bernie degrades cleanly
# ─────────────────────────────────────────────────────────────────────────────

x-mongo-uri: &mongo_uri
  MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin"

services:

  caddy:
    image: caddy:2-alpine
    container_name: f1_caddy
    restart: unless-stopped
    # The only ports on the host. Everything else talks over the internal network.
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - core-api

  mongodb:
    image: mongo:7.0
    container_name: f1_mongodb
    restart: unless-stopped
    # No `ports`. The database is reachable only from the compose network.
    # To inspect it, tunnel in: ssh -L 27017:localhost:27017 host, then
    # `docker compose exec mongodb mongosh`.
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}",
             "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: f1_ingestion
    restart: unless-stopped
    expose: ["8001"]
    environment:
      <<: *mongo_uri
      MONGO_DATABASE: "f1_ingestion"
      DATASET_ROOT: "/data/fastf1"
    volumes:
      - ./fastf1-data:/data/fastf1
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    container_name: f1_prediction
    restart: unless-stopped
    expose: ["8002"]
    environment:
      <<: *mongo_uri
      MONGO_DATABASE: "f1_prediction"
      INGESTION_SERVICE_URL: "http://ingestion-service:8001"
    depends_on:
      mongodb: {condition: service_healthy}
      ingestion-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  scoring-service:
    build:
      context: .
      dockerfile: services/scoring-service/Dockerfile
    container_name: f1_scoring
    restart: unless-stopped
    expose: ["8003"]
    environment:
      <<: *mongo_uri
      MONGO_DATABASE: "f1_scoring"
      INGESTION_SERVICE_URL: "http://ingestion-service:8001"
      PREDICTION_SERVICE_URL: "http://prediction-service:8002"
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    container_name: f1_core_api
    restart: unless-stopped
    # No host port: Caddy reaches it over the internal network.
    expose: ["8000"]
    environment:
      <<: *mongo_uri
      MONGO_DATABASE: "f1_core"
      INGESTION_SERVICE_URL: "http://ingestion-service:8001"
      PREDICTION_SERVICE_URL: "http://prediction-service:8002"
      SCORING_SERVICE_URL: "http://scoring-service:8003"
      JWT_SECRET: "${JWT_SECRET}"
      TINKER_API_KEY: "${TINKER_API_KEY:-}"
      # Budgets matter here and nowhere else: this is the deployment where the
      # number of callers stops being one.
      BERNIE_CALLS_PER_USER_PER_DAY: "${BERNIE_CALLS_PER_USER_PER_DAY:-20}"
      BERNIE_CALLS_PER_DAY: "${BERNIE_CALLS_PER_DAY:-500}"
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend/f1-react
      dockerfile: Dockerfile
    container_name: f1_frontend
    restart: unless-stopped
    expose: ["80"]
    depends_on:
      core-api: {condition: service_healthy}

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
