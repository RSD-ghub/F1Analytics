server:
  port: 8082
  host: 0.0.0.0
  static:
    classpath:
      location: web/f1
      welcome: index.html

mongo:
  connection: "mongodb://localhost:27017"
  database: "f1dashboard"

f1api:
  base-url: "https://api.jolpi.ca/ergast"

fastf1:
  dataset-root: "fastf1-data"
  storage:
    read-order: "mongo,file"
    write-targets: "mongo,file"
    parity-log-enabled: true
  python:
    enabled: true
    executable: ""
    script-path: "scripts/fastf1-ingest/ingest.py"
    requirements-path: "scripts/fastf1-ingest/requirements.txt"
  ingest:
    season-floor: 2010
    file-snapshot-enabled: false
    auto-refresh-enabled: true
    auto-refresh-hours: 24

cors:
  1:
    path-pattern: "/f1(/.*)?"
    allow-origins:
      - "http://localhost:8000"
    allow-methods:
      - "GET"
      - "POST"
      - "DELETE"
      - "OPTIONS"
