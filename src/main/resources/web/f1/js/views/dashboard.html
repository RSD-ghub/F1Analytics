<div class="dashboard-page">
    <div class="dashboard-toolbar">
        <div class="dashboard-toolbar__group">
            <oj-button on-oj-action="[[showRaceResults]]" chroming="callToAction" class="dashboard-btn-red oj-sm-margin-2x-end">
                Show Race Results
            </oj-button>
            <oj-button on-oj-action="[[goDriverFocus]]" chroming="callToAction" class="dashboard-btn-red">
                Driver Focus
            </oj-button>
        </div>

        <div class="dashboard-toolbar__group">
            <oj-button on-oj-action="[[syncCurrentSeason]]" class="dashboard-btn-red oj-sm-margin-2x-end" chroming="callToAction">
                Sync Current Season
            </oj-button>
            <oj-input-text value="{{syncSeason}}" label-hint="Season" label-edge="inside" class="dashboard-season-input oj-sm-margin-2x-end"></oj-input-text>
            <oj-button on-oj-action="[[syncSelectedSeason]]" class="dashboard-btn-red oj-sm-margin-2x-end">
                Sync Season
            </oj-button>
        </div>
    </div>

    <div class="dashboard-grid dashboard-grid--essentials">
        <section class="chart-card chart-card--warm">
            <div class="chart-card__header">
                <h3 class="chart-card__title">Driver Points Trend (Top 10)</h3>
                <p class="chart-card__kpi"><oj-bind-text value="[[driverHeadline]]"></oj-bind-text></p>
            </div>
            <div class="chart-card__body">
                <oj-chart class="chart-widget"
                          type="pie"
                          data="[[driverChartDp]]"
                          data-label="[[piePointsLabel]]"
                          animation-on-display="auto"
                          animation-on-data-change="auto"
                          legend='{"rendered":"off"}'
                          style-defaults='{"dataLabelPosition":"outsideSlice","seriesColors":["#ff3d5a","#ff6f61","#ff8a65","#ffb74d","#fdd835","#80cbc4","#4dd0e1","#64b5f6","#9575cd","#f06292"]}'>
                    <template slot="itemTemplate" data-oj-as="item">
                        <oj-chart-item value="[[item.data.value]]"
                                       short-desc="[[item.data.shortDesc]]"
                                       group-id="[[ [item.data.group] ]]"
                                       series-id="[[item.data.series]]">
                        </oj-chart-item>
                    </template>
                </oj-chart>
            </div>
        </section>

        <section class="chart-card chart-card--cool">
            <div class="chart-card__header">
                <h3 class="chart-card__title">Constructor Points Spread (Top 10)</h3>
                <p class="chart-card__kpi"><oj-bind-text value="[[constructorHeadline]]"></oj-bind-text></p>
            </div>
            <div class="chart-card__body">
                <oj-chart class="chart-widget"
                          type="pie"
                          data="[[constructorChartDp]]"
                          data-label="[[piePointsLabel]]"
                          animation-on-display="auto"
                          animation-on-data-change="auto"
                          legend='{"rendered":"off"}'
                          style-defaults='{"dataLabelPosition":"outsideSlice","seriesColors":["#18c6b3","#00bfa5","#26c6da","#4dd0e1","#81d4fa","#90caf9","#a5d6a7","#c5e1a5","#e6ee9c","#ffe082"]}'>
                    <template slot="itemTemplate" data-oj-as="item">
                        <oj-chart-item value="[[item.data.value]]"
                                       short-desc="[[item.data.shortDesc]]"
                                       group-id="[[ [item.data.group] ]]"
                                       series-id="[[item.data.series]]">
                        </oj-chart-item>
                    </template>
                </oj-chart>
            </div>
        </section>

        <section class="chart-card chart-card--neutral">
            <div class="chart-card__header">
                <h3 class="chart-card__title">Team Points</h3>
                <p class="chart-card__kpi"><oj-bind-text value="[[teamHeadline]]"></oj-bind-text></p>
            </div>
            <div class="chart-card__body">
                <oj-chart class="chart-widget"
                          type="bar"
                          data="[[teamPointsChartDp]]"
                          orientation="horizontal"
                          animation-on-display="auto"
                          animation-on-data-change="auto"
                          legend='{"rendered":"off"}'
                          y-axis='{"title":"Team","titleStyle":"font-size:12px;color:#eef4ff;","tickLabel":{"style":"font-size:11px;color:#eef4ff;"}}'
                          x-axis='{"title":"Points","titleStyle":"font-size:12px;color:#eef4ff;","tickLabel":{"style":"font-size:11px;color:#eef4ff;"}}'
                          style-defaults='{"seriesColors":["#ffd166"]}'>
                    <template slot="itemTemplate" data-oj-as="item">
                        <oj-chart-item value="[[item.data.value]]"
                                       short-desc="[[item.data.shortDesc]]"
                                       group-id="[[ [item.data.group] ]]"
                                       series-id="[[item.data.series]]">
                        </oj-chart-item>
                    </template>
                </oj-chart>
            </div>
        </section>

        <section class="chart-card chart-card--warm">
            <div class="chart-card__header">
                <h3 class="chart-card__title">Race Winners Count</h3>
                <p class="chart-card__kpi"><oj-bind-text value="[[winnerHeadline]]"></oj-bind-text></p>
            </div>
            <div class="chart-card__body">
                <oj-chart class="chart-widget"
                          type="bar"
                          data="[[winnersChartDp]]"
                          orientation="vertical"
                          animation-on-display="auto"
                          animation-on-data-change="auto"
                          legend='{"rendered":"off"}'
                          y-axis='{"title":"Wins","titleStyle":"font-size:12px;color:#eef4ff;","tickLabel":{"style":"font-size:11px;color:#eef4ff;"}}'
                          x-axis='{"title":"Driver","titleStyle":"font-size:12px;color:#eef4ff;","tickLabel":{"rotation":"none","style":"font-size:11px;color:#eef4ff;"}}'
                          style-defaults='{"seriesColors":["#ff6b6b"]}'>
                    <template slot="itemTemplate" data-oj-as="item">
                        <oj-chart-item value="[[item.data.value]]"
                                       short-desc="[[item.data.shortDesc]]"
                                       group-id="[[ [item.data.group] ]]"
                                       series-id="[[item.data.series]]">
                        </oj-chart-item>
                    </template>
                </oj-chart>
            </div>
        </section>
    </div>
</div>

<oj-drawer-popup edge="end"
                 modality="modal"
                 opened="{{resultsDrawerOpen}}"
                 auto-dismiss="focus-loss"
                 close-gesture="swipe"
                 style="width: min(86vw, 1200px);">
    <div class="results-drawer">
        <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center">
            <h3 class="results-drawer__title">Race Results</h3>
            <div class="results-drawer__actions">
                <oj-button on-oj-action="[[refreshDashboard]]" class="dashboard-btn-red oj-sm-margin-2x-end">Refresh</oj-button>
                <oj-button on-oj-action="[[closeRaceResults]]" class="dashboard-btn-red">Close</oj-button>
            </div>
        </div>

        <div class="results-drawer__table">
            <oj-table id="raceResultsTable"
                      class="results-table"
                      data="[[dp]]"
                      scroll-policy="loadMoreOnScroll"
                      scroll-policy-options='{"fetchSize": 12}'
                      columns='[[columns]]'>
            </oj-table>
        </div>
    </div>
</oj-drawer-popup>
