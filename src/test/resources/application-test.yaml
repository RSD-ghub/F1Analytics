security:
  enabled: false

fastf1:
  dataset-root: "target\\test-fastf1-data"
  storage:
    read-order: "file,mongo"
    write-targets: "file"
    parity-log-enabled: false
  python:
    enabled: false
    executable: ""
    script-path: "scripts/fastf1-ingest/ingest.py"
    requirements-path: "scripts/fastf1-ingest/requirements.txt"
  ingest:
    season-floor: 2010
    file-snapshot-enabled: true
    auto-refresh-enabled: false
    auto-refresh-hours: 24
